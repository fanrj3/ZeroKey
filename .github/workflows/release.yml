name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node scripts/check-public.mjs
      - run: npm run check
      - run: npm run test:ui
      - run: npm run test:mcp
      - run: npm run prepare:runtime
      - run: npm run prepare:agent
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build signed Windows installer
        run: npm run desktop:build -- --bundles nsis --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/verify-package.mjs
      - run: node scripts/release-manifest.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $tag "release/ZeroKey_${version}_x64-setup.exe" "release/ZeroKey_${version}_x64-setup.exe.sig" release/latest.json release/SHA256SUMS.txt --verify-tag --title "ZeroKey $tag" --notes-file release/notes.md
